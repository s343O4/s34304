<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piyapat Leelatanaporn - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #0f172a;
            --text-sub: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* Navigation */
        nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
            padding: 8px 16px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); z-index: 1000; display: flex; gap: 8px;
        }
        nav a {
            color: var(--text-sub); text-decoration: none; padding: 8px 18px;
            border-radius: 20px; font-weight: 400; transition: all 0.3s ease; font-size: 0.95rem;
        }
        nav a:hover, nav a.active { color: var(--primary); background: rgba(99, 102, 241, 0.08); font-weight: 500; }

        /* Hero Section */
        .hero {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 120px 20px 60px; position: relative;
        }

        .img-container { position: relative; margin-bottom: 25px; }
        .img-container::before {
            content: ''; position: absolute; inset: -5px;
            background: linear-gradient(45deg, #6366f1, #a855f7, #ec4899);
            border-radius: 50%; filter: blur(12px); opacity: 0.6;
            animation: pulse-glow 4s infinite alternate;
        }
        .hero img {
            width: 170px; height: 170px; border-radius: 50%; object-fit: cover;
            position: relative; border: 4px solid #fff; transition: transform 0.5s ease;
        }
        .hero img:hover { transform: scale(1.05) rotate(3deg); }

        .hero h1 { font-size: 2.6rem; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.5px; }
        .hero .subtitle { font-size: 1.25rem; color: var(--primary); font-weight: 500; margin-bottom: 12px; }
        .hero p { font-size: 1.05rem; color: var(--text-sub); max-width: 550px; margin-bottom: 30px; font-weight: 300; }

        .btn {
            background: var(--primary); color: white; padding: 12px 32px; border-radius: 30px;
            text-decoration: none; font-weight: 500; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: inline-flex; align-items: center; gap: 8px;
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-3px); box-shadow: 0 15px 25px rgba(99, 102, 241, 0.4); }

        @keyframes pulse-glow {
            0% { opacity: 0.4; transform: scale(0.98); }
            100% { opacity: 0.8; transform: scale(1.03); }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="active">หน้าแรก</a>
        <a href="about.html">เกี่ยวกับฉัน</a>
        <a href="academics.html">การศึกษา</a>
        <a href="portfolio.html">ผลงาน</a>
        <a href="certificate.html">เกียรติบัตร</a>
    </nav>

    <div class="hero">
        <div class="img-container">
            <img src="images/images.jpg" alt="ปิยพัทธ์ ลีลาทนาพร">
        </div>
        <h1>นายปิยพัทธ์ ลีลาทนาพร</h1>
        <div class="subtitle">นักเรียนชั้น ม.6 | แผนการเรียน วิทยาศาสตร์-คณิตศาสตร์ (MSEP)</div>
        <p>มุ่งมั่นสู่ คณะเภสัชศาสตร์ มหาวิทยาลัยมหิดล ด้วยความสนใจในกระบวนการผลิต กลไกและการออกฤทธิ์ของยา</p>
        <a href="about.html" class="btn">ทำความรู้จักเพิ่มเติม ➔</a>
    </div>

</body>
</html>
