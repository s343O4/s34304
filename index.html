<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - Piyapat Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e0e7ff 100%); --primary: #0284c7; --text-main: #0f172a; --text-sub: #475569; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding-top: 100px; padding-bottom: 60px; overflow-x: hidden; }

        @keyframes floatImage { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-8px) rotate(1.5deg); } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15); } 50% { box-shadow: 0 18px 40px rgba(56, 189, 248, 0.28); } }
        @keyframes borderPulse { 0%, 100% { box-shadow: 0 0 15px rgba(2, 132, 199, 0.3); } 50% { box-shadow: 0 0 25px rgba(2, 132, 199, 0.6); } }

        nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px);
            padding: 6px 12px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.12); z-index: 1000; display: flex; align-items: center; gap: 6px;
        }
        nav a { color: #334155; text-decoration: none; padding: 10px 22px; border-radius: 30px; font-size: 0.95rem; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        nav a:hover { color: var(--primary); transform: translateY(-2px); }
        nav a.active { color: var(--primary); background: #e0f2fe; font-weight: 500; }

        .page-frame {
            background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 36px;
            padding: 40px; max-width: 800px; margin: 0 auto; text-align: center;
            animation: pulseGlow 6s infinite ease-in-out; transition: transform 0.3s ease;
        }

        .img-container img { 
            width: 160px; height: 160px; border-radius: 50%; object-fit: cover; 
            border: 4px solid #fff; box-shadow: 0 12px 25px rgba(2, 132, 199, 0.15); 
            animation: floatImage 4.5s ease-in-out infinite; transition: transform 0.3s ease;
        }
        .img-container img:hover { transform: scale(1.05) rotate(-2deg); }

        h1 { font-size: 2.2rem; font-weight: 600; margin: 15px 0 8px; transition: color 0.3s ease; }
        .subtitle { font-size: 1.1rem; color: var(--primary); font-weight: 500; margin-bottom: 12px; }
        p { font-size: 0.95rem; color: var(--text-sub); max-width: 580px; margin: 0 auto 25px; line-height: 1.6; }

        /* จัดตำแหน่งปุ่มตรงกลางล่าง + ไฮไลต์กรอบ */
        .bottom-nav { 
            display: flex; justify-content: center; align-items: center; 
            margin-top: 25px; padding-bottom: 30px; border-bottom: 1px solid rgba(186, 230, 253, 0.6); 
        }
        .highlight-btn {
            display: inline-flex; align-items: center; gap: 10px;
            text-decoration: none; color: #0284c7; font-weight: 600; font-size: 1.05rem;
            padding: 12px 28px; border-radius: 50px; background: white;
            border: 2px solid var(--primary);
            animation: borderPulse 3s infinite ease-in-out;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .highlight-btn:hover {
            background: var(--primary); color: white;
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.35);
        }
        .arrow-circle { 
            width: 32px; height: 32px; background: #e0f2fe; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            color: var(--primary); transition: all 0.3s ease; 
        }
        .highlight-btn:hover .arrow-circle { background: white; color: var(--primary); transform: translateX(3px); }

        .contact-section { margin-top: 25px; padding-top: 5px; }
        .contact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; text-align: left; }
        .contact-item { display: flex; flex-direction: column; gap: 4px; transition: transform 0.2s ease; }
        .contact-item:hover { transform: translateY(-2px); }
        .contact-label { font-size: 1rem; font-weight: 600; color: var(--text-main); }
        .contact-value { font-size: 0.9rem; color: var(--text-sub); }
        .contact-value a { color: var(--text-sub); text-decoration: none; transition: color 0.2s ease; }
        .contact-value a:hover { color: var(--primary); text-decoration: underline; }

        @media (max-width: 650px) { .contact-grid { grid-template-columns: 1fr; text-align: center; } .page-frame { padding: 25px 20px; } }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="active">หน้าแรก</a>
        <a href="about.html">เกี่ยวกับฉัน</a>
        <a href="education.html">เป้าหมาย</a>
        <a href="skills.html">ทักษะความสามารถ</a>
        <a href="portfolio.html">ผลงาน</a>
    </nav>

    <div class="page-frame">
        <div class="img-container">
            <img src="images/images.jpg" alt="ปิยพัทธ์ ลีลาทนาพร">
        </div>
        <h1>นายปิยพัทธ์ ลีลาทนาพร</h1>
        <div class="subtitle">นักเรียนชั้น มัธยมศึกษาปีที่ 6 | แผนการเรียน วิทยาศาสตร์-คณิตศาสตร์ (MSEP)</div>


        <!-- ปุ่มอยู่ตรงกลางล่าง + กรอบไฮไลต์ -->
        <div class="bottom-nav">
            <a href="about.html" class="highlight-btn">
                ไปที่หน้า เกี่ยวกับฉัน <div class="arrow-circle">➔</div>
            </a>
        </div>

        <div class="contact-section">
            <div class="contact-grid">
                <div class="contact-item">
                    <span class="contact-label">Phone</span>
                    <span class="contact-value">061-038-3350</span>
                </div>
                <div class="contact-item">
                    <span class="contact-label">Email</span>
                    <span class="contact-value">s34304@banbung.ac.th</span>
                </div>
                <div class="contact-item">
                    <span class="contact-label">Follow Me</span>
                    <span class="contact-value"><a href="https://www.instagram.com/holychxit/" target="_blank">Instagram</a> | <a href="https://www.facebook.com/holychxit" target="_blank">Facebook</a></span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
