<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นายปิยพัทธ์ ลีลาทนาพร | Home</title>
    <!-- โหลด ฟอนต์ Prompt จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Modern Glassmorphism Theme */
        :root {
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f3e8ff 50%, #fce7f3 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.9);
            --text-main: #374151;
            --text-sub: #6b7280;
            --purple-dark: #6d28d9;
            --purple-primary: #8b5cf6;
            --purple-light: #f3e8ff;
            --shadow-soft: 0 20px 40px rgba(139, 92, 246, 0.15);
            --transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
            background-attachment: fixed;
        }

        /* Hero Card Container */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            box-shadow: var(--shadow-soft);
            max-width: 460px;
            width: 100%;
            text-align: center;
            padding: 40px 30px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px rgba(139, 92, 246, 0.22);
        }

        /* Profile Image */
        .profile-wrapper {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 20px auto;
        }

        .profile-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.25);
            transition: var(--transition);
        }

        .card:hover .profile-wrapper img {
            transform: scale(1.05) rotate(3deg);
        }

        /* Text Styles */
        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--purple-dark);
            margin-bottom: 6px;
        }

        .badge {
            display: inline-block;
            background-color: var(--purple-light);
            color: var(--purple-dark);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 20px;
            border: 1px solid #e9d5ff;
        }

        p.bio {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Action Button (ชี้ไปที่ portfolio.html) */
        .btn-portfolio {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, #38bdf8 0%, #8b5cf6 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
            transition: var(--transition);
        }

        .btn-portfolio:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(139, 92, 246, 0.45);
            background: linear-gradient(135deg, #0284c7 0%, #6d28d9 100%);
        }

        .btn-portfolio:active {
            transform: scale(0.98);
        }

        footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-wrapper">
            <img src="images/images.jpg" alt="นายปิยพัทธ์ ลีลาทนาพร">
        </div>

        <h1>นายปิยพัทธ์ ลีลาทนาพร</h1>
        <div class="badge">🧪 แผนการเรียน วิทย์-คณิต (MSEP)</div>

        <p class="bio">
            ยินดีต้อนรับสู่เว็บไซต์ ผมมีความสนใจในวิชาเคมีและชีววิทยา มุ่งมั่นศึกษาต่อในระดับอุดมศึกษาเพื่อก้าวสู่อาชีพทางด้านสาธารณสุขและยา
        </p>

        <!-- ลิงก์ตรงนี้ถูกปรับให้กดแล้วไปหน้า portfolio.html เรียบร้อยแล้ว -->
        <a href="portfolio.html" class="btn-portfolio">
            💙 เข้าสู่ My Portfolio
        </a>

        <footer>
            &copy; Piyapat Leelathanaporn | GitHub Pages
        </footer>
    </div>

</body>
</html>
