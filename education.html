<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เป้าหมายศึกษาต่อ - Piyapat Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e0e7ff 100%); --primary: #0284c7; --text-main: #0f172a; --text-sub: #475569; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding-top: 100px; padding-bottom: 60px; }

        nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px);
            padding: 6px 12px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.12); z-index: 1000; display: flex; align-items: center; gap: 6px;
        }
        nav a { color: #334155; text-decoration: none; padding: 10px 22px; border-radius: 30px; font-size: 0.95rem; transition: all 0.25s ease; }
        nav a:hover { color: var(--primary); }
        nav a.active { color: var(--primary); background: #e0f2fe; font-weight: 500; }

        .page-frame { max-width: 850px; margin: 0 auto; padding: 40px; background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(20px); border-radius: 36px; border: 2px solid rgba(255, 255, 255, 0.8); box-shadow: 0 20px 50px rgba(56, 189, 248, 0.12); }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; border-radius: 20px; padding: 25px; border: 1px solid rgba(186, 230, 253, 0.8); }
        .card-icon { font-size: 2rem; color: var(--primary); margin-bottom: 10px; }
        .card-heading { font-size: 1.2rem; font-weight: 600; }

        .bottom-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; padding-bottom: 25px; border-bottom: 1px solid rgba(186, 230, 253, 0.6); }
        .nav-btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--primary); font-weight: 500; }
        .arrow-circle { width: 32px; height: 32px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .contact-section { margin-top: 25px; padding-top: 5px; }
        .contact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; text-align: left; }
        .contact-item { display: flex; flex-direction: column; gap: 4px; }
        .contact-label { font-size: 0.95rem; font-weight: 600; color: var(--text-main); }
        .contact-value { font-size: 0.9rem; color: var(--text-sub); }
        .contact-value a { color: var(--text-sub); text-decoration: none; }
        .contact-value a:hover { color: var(--primary); text-decoration: underline; }

        @media (max-width: 650px) { .page-frame { padding: 20px; } .contact-grid { grid-template-columns: 1fr; text-align: center; } }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">หน้าแรก</a>
        <a href="about.html">เกี่ยวกับฉัน</a>
        <a href="education.html" class="active">เป้าหมายศึกษาต่อ</a>
        <a href="skills.html">ทักษะความสามารถ</a>
        <a href="portfolio.html">ผลงาน</a>
    </nav>

    <div class="page-frame">
        <h2>🎯 เป้าหมายการศึกษาต่อ</h2>
        <div class="grid-container">
            <div class="card">
                <div class="card-icon"><i class="fa-solid fa-university"></i></div>
                <div class="card-heading">มหาวิทยาลัยมหิดล</div>
                <p style="color: var(--primary); font-weight: 500; margin-top: 4px;">คณะเภสัชศาสตร์</p>
            </div>
            <div class="card">
                <div class="card-icon"><i class="fa-solid fa-pills"></i></div>
                <div class="card-heading">เป้าหมาย</div>
                <p style="color: var(--text-sub); font-size: 0.9rem; margin-top: 4px;">มุ่งศึกษาต่อเพื่อก้าวสู่การเป็นเภสัชกร มีความเชี่ยวชาญด้านเภสัชกรรมและการวิจัยพัฒนา ยา</p>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="about.html" class="nav-btn"><div class="arrow-circle">⬅</div> ย้อนกลับ</a>
            <a href="skills.html" class="nav-btn">ไปที่หน้า ทักษะความสามารถ <div class="arrow-circle">➔</div></a>
        </div>

        <div class="contact-section">
            <div class="contact-grid">
                <div class="contact-item">
                    <span class="contact-label">Phone</span>
                    <span class="contact-value">098-561-6468</span>
                </div>
