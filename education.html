<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เป้าหมายศึกษาต่อ - Piyapat Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e0e7ff 100%);
            --primary: #0284c7;
            --text-main: #0f172a;
            --text-sub: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding-top: 100px; padding-bottom: 60px; }

        nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px);
            padding: 8px 16px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.15); z-index: 1000; display: flex; gap: 8px;
        }
        nav a { color: var(--text-sub); text-decoration: none; padding: 8px 18px; border-radius: 20px; font-size: 0.95rem; transition: all 0.3s; }
        nav a:hover, nav a.active { color: var(--primary); background: rgba(56, 189, 248, 0.12); font-weight: 500; }

        .page-frame {
            max-width: 900px; margin: 0 auto; padding: 40px;
            background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(20px);
            border-radius: 36px; border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 50px rgba(56, 189, 248, 0.12); position: relative;
        }

        .section-title { font-size: 1.6rem; color: var(--text-main); margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }

        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;
        }

        .card {
            background: white; border-radius: 24px; padding: 28px;
            border: 1px solid rgba(186, 230, 253, 0.8); box-shadow: 0 10px 25px rgba(56, 189, 248, 0.05);
            transition: all 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 20px 35px rgba(56, 189, 248, 0.12); }

        .badge {
            display: inline-block; background: #e0f2fe; color: var(--primary);
            padding: 4px 14px; border-radius: 12px; font-size: 0.85rem; font-weight: 500; margin-bottom: 15px;
        }

        .card-icon { font-size: 2.2rem; color: var(--primary); margin-bottom: 12px; }
        .card-title { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 4px; }
        .card-heading { font-size: 1.25rem; font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
        .card-subheading { font-size: 1.05rem; color: var(--primary); font-weight: 500; margin-bottom: 10px; }
        .card-desc { font-size: 0.95rem; color: var(--text-sub); line-height: 1.6; font-weight: 300; }

        .next-page-btn {
            display: flex; justify-content: center; align-items: center; gap: 8px;
            margin-top: 35px; text-decoration: none; color: var(--primary); font-weight: 500;
        }
        .next-page-btn .arrow { width: 32px; height: 32px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        @media (max-width: 650px) { .page-frame { padding: 20px; } }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">หน้าแรก</a>
        <a href="about.html">เกี่ยวกับฉัน</a>
        <a href="education.html" class="active">เป้าหมายศึกษาต่อ</a>
        <a href="portfolio.html">ผลงาน</a>
    </nav>

    <div class="page-frame">
        <h2 class="section-title">🎯 เป้าหมายและการศึกษาต่อ</h2>

        <div class="grid-container">
            <div class="card">
                <span class="badge">• Target University</span>
                <div class="card-icon"><i class="fa-solid fa-university"></i></div>
                <div class="card-title">มหาวิทยาลัยที่มุ่งหวัง</div>
                <div class="card-heading">มหาวิทยาลัยมหิดล</div>
                <div class="card-subheading">คณะเภสัชศาสตร์</div>
            </div>

            <div class="card">
                <span class="badge">• Future Plan</span>
                <div class="card-icon"><i class="fa-solid fa-rocket"></i></div>
                <div class="card-title">เป้าหมายการศึกษา</div>
                <div class="card-desc">
                    มุ่งมั่นพัฒนาตนเอง และหาความรู้ในการเข้าศึกษาต่อและวางแผนในการประกอบอาชีพในอนาคต
                </div>
            </div>
        </div>

        <!-- ลิงก์ไปยังหน้าถัดไป: ผลงาน -->
        <a href="portfolio.html" class="next-page-btn">
            ไปที่หน้า ผลงาน <div class="arrow">➔</div>
        </a>
    </div>

</body>
</html>
